
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Shoes Store</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #111827, #2563eb);
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            padding: 35px;
            border-radius: 15px;
            background: white;
            box-shadow: 0 10px 35px #0004;
        }

        .logo {
            margin-bottom: 10px;
            text-align: center;
            font-size: 27px;
            font-weight: bold;
            color: #111827;
        }

        .subtitle {
            margin-bottom: 25px;
            text-align: center;
            color: #64748b;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            color: #dc2626;
        }

        .demo {
            margin-top: 20px;
            padding: 12px;
            border-radius: 7px;
            background: #eff6ff;
            color: #1e40af;
            font-size: 13px;
            line-height: 1.8;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <div class="logo">👟 SHOES STORE</div>
        <p class="subtitle">Đăng nhập quản trị viên</p>

        <form id="loginForm">
            <label for="email">Email Admin</label>
            <input
                type="email"
                id="email"
                placeholder="Nhập email"
                value="admin@gmail.com"
                required
            >

            <label for="password">Mật khẩu</label>
            <input
                type="password"
                id="password"
                placeholder="Nhập mật khẩu"
                value="admin123"
                required
            >

            <button type="submit" id="loginButton">
                Đăng nhập
            </button>

            <p id="message"></p>
        </form>

        <div class="demo">
            <strong>Tài khoản demo</strong><br>
            Email: admin@gmail.com<br>
            Mật khẩu: admin123
        </div>
    </div>

    <script>
        const SESSION_KEY = "shoesAdminSession";

        document.getElementById("loginForm").addEventListener(
            "submit",
            function (event) {
                event.preventDefault();

                const email = document.getElementById("email")
                    .value.trim().toLowerCase();

                const password = document.getElementById("password").value;
                const message = document.getElementById("message");
                const button = document.getElementById("loginButton");

                // Kiểm tra tài khoản demo
                if (
                    email === "admin@gmail.com" &&
                    password === "admin123"
                ) {
                    sessionStorage.setItem(
                        SESSION_KEY,
                        JSON.stringify({
                            id: 1,
                            name: "Admin Demo",
                            email: email,
                            role: "admin"
                        })
                    );

                    message.style.color = "#16a34a";
                    message.textContent =
                        "Đăng nhập thành công! Đang chuyển trang...";

                    button.disabled = true;

                    // Tự động chuyển đến Dashboard Admin
                    window.location.href = "./admin_base.html";
                } else {
                    message.style.color = "#dc2626";
                    message.textContent =
                        "Email hoặc mật khẩu không chính xác!";
                }
            }
        );
    </script>
</body>
</html>
