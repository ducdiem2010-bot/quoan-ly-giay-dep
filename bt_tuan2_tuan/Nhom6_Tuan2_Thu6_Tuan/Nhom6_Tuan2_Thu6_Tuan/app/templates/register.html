{% extends 'base.html' %}
{% block title %}Đăng ký - Shoes Store{% endblock %}
{% block content %}<div class="auth-container"><div class="auth-card"><span class="eyebrow">KHÁCH HÀNG</span><h1>Tạo tài khoản</h1>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label for="full_name">Họ và tên</label><input id="full_name" name="full_name" type="text" required maxlength="100" autocomplete="name">
<label for="email">Email</label><input id="email" name="email" type="email" required maxlength="150" autocomplete="email">
<label for="password">Mật khẩu (tối thiểu 8 ký tự)</label><input id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
<button class="action-primary" type="submit">Đăng ký</button></form><p>Đã có tài khoản? <a href="{{ url_for('login') }}">Đăng nhập</a>.</p></div></div>{% endblock %}
