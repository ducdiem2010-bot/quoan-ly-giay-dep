{% extends 'base.html' %}
{% block title %}Đăng nhập - Shoes Store{% endblock %}
{% block content %}<div class="auth-container"><div class="auth-card"><span class="eyebrow">TÀI KHOẢN</span><h1>Đăng nhập</h1>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="next" value="{{ next_path }}">
<label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email" placeholder="ban@example.com">
<label for="password">Mật khẩu</label><input id="password" name="password" type="password" required autocomplete="current-password">
<button class="action-primary" type="submit">Đăng nhập</button></form>
<p>Chưa có tài khoản? <a href="{{ url_for('register') }}">Đăng ký</a>.</p></div></div>{% endblock %}
