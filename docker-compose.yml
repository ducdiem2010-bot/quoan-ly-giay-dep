version: '3.8'

services:
  web:
    build: .
    container_name: shoes_store_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DB_BACKEND=sqlite
      - HOST=0.0.0.0
      - PORT=5000
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY}
    volumes:
      - sqlite_data:/app/instance

volumes:
  sqlite_data:
