
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý ảnh sản phẩm - Shoes Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>SHOES ADMIN</h1>
        <p>Quản lý ảnh sản phẩm giày dép</p>
    </header>

    <main class="container">
        <section class="panel">
            <h2>Danh sách ảnh sản phẩm</h2>

            <label for="productId">Mã sản phẩm</label>
            <input id="productId" value="SP001" maxlength="30">

            <div class="upload-area">
                <label for="imageInput">Thêm ảnh mới</label>
                <input
                    id="imageInput"
                    type="file"
                    accept="image/jpeg,image/png,image/webp"
                    multiple
                >
                <small>JPEG, PNG, WebP — tối đa 5 MB/ảnh.</small>
                <button id="addBtn" type="button">Thêm ảnh</button>
            </div>

            <p id="message" role="status"></p>
            <p id="imageCount">Số ảnh: 0</p>

            <div id="imageList" class="image-list"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
