
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý biến thể giày dép</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6f9;
    color: #222;
}

header {
    background: #202b3c;
    color: white;
    padding: 22px 30px;
}

header h1 {
    font-size: 24px;
}

.container {
    max-width: 1150px;
    margin: 30px auto;
    padding: 0 20px;
}

.card {
    background: white;
    padding: 24px;
    border-radius: 10px;
    margin-bottom: 22px;
    box-shadow: 0 2px 10px #0000000d;
}

h2 {
    margin-bottom: 20px;
    font-size: 19px;
}

.form-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
    font-size: 14px;
}

input {
    width: 100%;
    padding: 11px;
    border: 1px solid #ccd2dc;
    border-radius: 6px;
    outline-color: #2563eb;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

button {
    border: none;
    border-radius: 6px;
    padding: 10px 15px;
    cursor: pointer;
    color: white;
    font-weight: bold;
}

.btn-add { background: #2563eb; }
.btn-reset { background: #64748b; }
.btn-edit { background: #d97706; }
.btn-hide { background: #dc2626; }
.btn-show { background: #15803d; }

button:hover {
    opacity: 0.85;
}

.message {
    margin-top: 15px;
    font-size: 14px;
    font-weight: bold;
}

.search {
    max-width: 350px;
    margin-bottom: 18px;
}

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 750px;
}

th, td {
    border-bottom: 1px solid #e5e7eb;
    padding: 14px 12px;
    text-align: left;
}

th {
    background: #f1f5f9;
}

.status-active {
    color: #15803d;
    font-weight: bold;
}

.status-hidden {
    color: #dc2626;
    font-weight: bold;
}

.actions {
    display: flex;
    gap: 7px;
}

.empty {
    text-align: center;
    padding: 25px;
    color: #64748b;
}

@media (max-width: 750px) {
    .form-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    header {
        padding: 20px;
    }

    .card {
        padding: 16px;
    }
}

@media (max-width: 450px) {
    .form-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>SHOES STORE - Quản lý biến thể</h1>
</header>

<main class="container">

    <section class="card">
        <h2 id="formTitle">Thêm biến thể sản phẩm</h2>

        <form id="variantForm">
            <input type="hidden" id="variantId">

            <div class="form-grid">
                <div>
                    <label for="product_id">Product ID</label>
                    <input id="product_id" type="number"
                           min="1" step="1" required
                           placeholder="Ví dụ: 1">
                </div>

                <div>
                    <label for="color_id">Color ID</label>
                    <input id="color_id" type="number"
                           min="1" step="1" required
                           placeholder="Ví dụ: 2">
                </div>

                <div>
                    <label for="size_id">Size ID</label>
                    <input id="size_id" type="number"
                           min="1" step="1" required
                           placeholder="Ví dụ: 40">
                </div>

                <div>
                    <label for="stock_qty">Stock quantity</label>
                    <input id="stock_qty" type="number"
                           min="0" step="1" required
                           placeholder="Ví dụ: 20">
                </div>
            </div>

            <div class="buttons">
                <button class="btn-add" type="submit" id="submitBtn">
                    Thêm biến thể
                </button>

                <button class="btn-reset" type="button" id="resetBtn">
                    Làm mới
                </button>
            </div>

            <p class="message" id="message" role="status"></p>
        </form>
    </section>

    <section class="card">
        <h2>Danh sách biến thể</h2>

        <input class="search" id="search"
               placeholder="Tìm theo Product ID, Color ID, Size ID...">

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Product ID</th>
                        <th>Color ID</th>
                        <th>Size ID</th>
                        <th>Stock Qty</th>
                        <th>Trạng thái</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="variantList"></tbody>
            </table>
        </div>
    </section>

</main>

<script>
const STORAGE_KEY = "shoes_variants_v1";

let variants = [];

try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    variants = Array.isArray(saved) ? saved : [];
} catch {
    variants = [];
}

let nextId = variants.reduce(
    (max, item) => Math.max(max, Number(item.id) || 0), 0
) + 1;

const form = document.getElementById("variantForm");
const message = document.getElementById("message");
const list = document.getElementById("variantList");

function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(variants));
}

function showMessage(text, success = false) {
    message.textContent = text;
    message.style.color = success ? "#15803d" : "#dc2626";
}

function getInteger(id, fieldName, min) {
    const input = document.getElementById(id);
    const raw = input.value.trim();
    const value = Number(raw);

    if (raw === "" || !Number.isSafeInteger(value) || value < min) {
        throw new Error(
            fieldName + " phải là số nguyên " +
            (min === 0 ? "không âm." : "lớn hơn 0.")
        );
    }

    return value;
}

function resetForm() {
    form.reset();
    document.getElementById("variantId").value = "";
    document.getElementById("formTitle").textContent =
        "Thêm biến thể sản phẩm";
    document.getElementById("submitBtn").textContent =
        "Thêm biến thể";
    message.textContent = "";
}

document.getElementById("resetBtn").addEventListener("click", resetForm);

form.addEventListener("submit", function(event) {
    event.preventDefault();

    try {
        const idValue = document.getElementById("variantId").value;

        const product_id = getInteger("product_id", "Product ID", 1);
        const color_id = getInteger("color_id", "Color ID", 1);
        const size_id = getInteger("size_id", "Size ID", 1);
        const stock_qty = getInteger("stock_qty", "Stock Qty", 0);

        // Không cho phép trùng bộ product + color + size.
        // Bản ghi đã ẩn cũng không được tạo trùng.
        const duplicate = variants.some(item =>
            item.product_id === product_id &&
            item.color_id === color_id &&
            item.size_id === size_id &&
            String(item.id) !== idValue
        );

        if (duplicate) {
            throw new Error(
                "Biến thể này đã tồn tại: Product + Color + Size bị trùng."
            );
        }

        if (idValue !== "") {
            const item = variants.find(
                v => String(v.id) === idValue
            );

            if (!item) {
                throw new Error("Không tìm thấy biến thể cần sửa.");
            }

            // Sửa dữ liệu nhưng giữ nguyên trạng thái ẩn/hiện.
            item.product_id = product_id;
            item.color_id = color_id;
            item.size_id = size_id;
            item.stock_qty = stock_qty;

            showMessage("Cập nhật biến thể thành công!", true);
        } else {
            variants.push({
                id: nextId++,
                product_id,
                color_id,
                size_id,
                stock_qty,
                is_active: true
            });

            showMessage("Thêm biến thể thành công!", true);
        }

        saveData();
        renderVariants();
        resetForm();

    } catch (error) {
        showMessage(error.message);
    }
});

function editVariant(id) {
    const item = variants.find(v => v.id === id);

    if (!item) return;

    if (!item.is_active) {
        showMessage("Biến thể đã ẩn. Hãy hiện lại trước khi sửa.");
        return;
    }

    document.getElementById("variantId").value = item.id;
    document.getElementById("product_id").value = item.product_id;
    document.getElementById("color_id").value = item.color_id;
    document.getElementById("size_id").value = item.size_id;
    document.getElementById("stock_qty").value = item.stock_qty;

    document.getElementById("formTitle").textContent =
        "Sửa biến thể #" + item.id;

    document.getElementById("submitBtn").textContent =
        "Lưu thay đổi";

    showMessage("Đang sửa biến thể #" + item.id, true);

    window.scrollTo({ top: 0, behavior: "smooth" });
}

function hideVariant(id) {
    const item = variants.find(v => v.id === id);

    if (!item) return;

    if (!confirm("Bạn có chắc muốn ẩn biến thể #" + id + "?")) {
        return;
    }

    item.is_active = false;
    saveData();
    renderVariants();
    showMessage("Đã ẩn biến thể. Dữ liệu vẫn được giữ lại.", true);
}

function showVariant(id) {
    const item = variants.find(v => v.id === id);

    if (!item) return;

    item.is_active = true;
    saveData();
    renderVariants();
    showMessage("Đã hiện lại biến thể #" + id, true);
}

function renderVariants() {
    const keyword = document.getElementById("search")
        .value.trim().toLowerCase();

    const filtered = variants.filter(item =>
        [
            item.id,
            item.product_id,
            item.color_id,
            item.size_id,
            item.stock_qty
        ].some(value => String(value).includes(keyword))
    );

    list.replaceChildren();

    if (filtered.length === 0) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");

        cell.colSpan = 7;
        cell.className = "empty";
        cell.textContent = "Chưa có biến thể phù hợp.";

        row.appendChild(cell);
        list.appendChild(row);
        return;
    }

    filtered.forEach(item => {
        const row = document.createElement("tr");

        const values = [
            item.id,
            item.product_id,
            item.color_id,
            item.size_id,
            item.stock_qty
        ];

        values.forEach(value => {
            const cell = document.createElement("td");
            cell.textContent = value;
            row.appendChild(cell);
        });

        const statusCell = document.createElement("td");
        statusCell.textContent = item.is_active ? "Đang hiện" : "Đã ẩn";
        statusCell.className = item.is_active
            ? "status-active"
            : "status-hidden";

        row.appendChild(statusCell);

        const actionCell = document.createElement("td");
        const actions = document.createElement("div");
        actions.className = "actions";

        if (item.is_active) {
            const editBtn = document.createElement("button");
            editBtn.className = "btn-edit";
            editBtn.textContent = "Sửa";
            editBtn.addEventListener("click", () => editVariant(item.id));

            const hideBtn = document.createElement("button");
            hideBtn.className = "btn-hide";
            hideBtn.textContent = "Ẩn";
            hideBtn.addEventListener("click", () => hideVariant(item.id));

            actions.append(editBtn, hideBtn);
        } else {
            const showBtn = document.createElement("button");
            showBtn.className = "btn-show";
            showBtn.textContent = "Hiện lại";
            showBtn.addEventListener("click", () => showVariant(item.id));

            actions.appendChild(showBtn);
        }

        actionCell.appendChild(actions);
        row.appendChild(actionCell);
        list.appendChild(row);
    });
}

document.getElementById("search").addEventListener(
    "input", renderVariants
);

renderVariants();
</script>

</body>
</html>
