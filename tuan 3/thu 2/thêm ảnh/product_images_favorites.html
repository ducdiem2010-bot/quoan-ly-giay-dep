
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ảnh sản phẩm và yêu thích - Shoes Store</title>

    <!-- Liên kết CSS -->
    <link rel="stylesheet" href="product_images_favorites.css">
</head>
<body>

    <header class="header">
        <h1>SHOES STORE</h1>
        <p>Quản lý ảnh sản phẩm và danh sách yêu thích</p>
    </header>

    <main class="container">
        <h2>Danh sách sản phẩm</h2>

        <p class="note">
            Nhấn vào ảnh nhỏ để chọn ảnh đại diện.
            Dùng nút lên/xuống để thay đổi thứ tự ảnh.
        </p>

        <!-- JavaScript sẽ hiển thị sản phẩm tại đây -->
        <div id="productContainer" class="product-container"></div>

        <section class="favorites-section">
            <h2>Sản phẩm yêu thích ❤️</h2>
            <div id="favoritesList" class="favorites-list"></div>
        </section>
    </main>

    <footer class="footer">
        <p>© 2026 Shoes Store</p>
    </footer>

    <!-- Liên kết JavaScript -->
    <script src="product_images_favorites.js"></script>
</body>
</html>
