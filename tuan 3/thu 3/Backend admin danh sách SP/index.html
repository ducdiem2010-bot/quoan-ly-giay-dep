
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Quản lý giày dép</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <aside class="sidebar">
        <h2>SHOES ADMIN</h2>
        <a href="#" class="active">Dashboard</a>
        <a href="#">Quản lý sản phẩm</a>
        <a href="#">Đơn hàng</a>
        <a href="#">Khách hàng</a>
        <a href="#">Danh mục</a>
        <button id="logoutBtn" class="logout">Đăng xuất</button>
    </aside>

    <main class="content">
        <header class="topbar">
            <h2>Danh sách sản phẩm</h2>
            <span id="roleLabel">Quyền: Admin</span>
        </header>

        <section class="panel">
            <div class="toolbar">
                <input
                    type="search"
                    id="searchInput"
                    placeholder="Tìm kiếm theo tên sản phẩm..."
                >
                <button id="searchBtn">Tìm kiếm</button>
                <button id="addBtn" class="add-btn">+ Thêm sản phẩm</button>
            </div>

            <p id="message"></p>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Mã SP</th>
                            <th>Tên sản phẩm</th>
                            <th>Thương hiệu</th>
                            <th>Loại</th>
                            <th>Giới tính</th>
                            <th>Giá</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="productList"></tbody>
                </table>
            </div>

            <div class="pagination">
                <span id="pageInfo"></span>
                <div>
                    <button id="prevBtn">Trước</button>
                    <button id="nextBtn">Sau</button>
                </div>
            </div>
        </section>
    </main>

    <script src="admin.js"></script>
</body>
</html>
