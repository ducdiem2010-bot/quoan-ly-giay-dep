```html
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quản lý sản phẩm - Shoes Store</title>

    <link rel="stylesheet" href="admin.css">
    <script src="admin.js" defer></script>
</head>

<body>
    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h2>SHOES ADMIN</h2>

        <nav class="sidebar-nav">
            <a href="admin_base.html">Dashboard</a>

            <a href="product.html" class="active">
                Quản lý sản phẩm
            </a>

            <a href="admin_orders.html">Đơn hàng</a>

            <a href="admin_customers.html">Khách hàng</a>

            <a href="admin_categories.html">Danh mục</a>
        </nav>

        <button type="button" id="logoutBtn" class="logout">
            Đăng xuất
        </button>
    </aside>

    <!-- NỘI DUNG CHÍNH -->
    <main class="content">
        <!-- THANH TIÊU ĐỀ -->
        <header class="topbar">
            <div>
                <h2>Quản lý sản phẩm</h2>
                <p>Quản lý danh sách giày dép của cửa hàng</p>
            </div>

            <span id="roleLabel">Quyền: Admin</span>
        </header>

        <!-- KHU VỰC DANH SÁCH -->
        <section class="panel">
            <div class="toolbar">
                <input
                    type="search"
                    id="searchInput"
                    placeholder="Tìm kiếm theo tên, mã hoặc thương hiệu..."
                    aria-label="Tìm kiếm sản phẩm"
                >

                <button type="button" id="searchBtn">
                    Tìm kiếm
                </button>

                <button type="button" id="addBtn" class="add-btn">
                    + Thêm sản phẩm
                </button>
            </div>

            <!-- THÔNG BÁO -->
            <p id="message" role="status" aria-live="polite"></p>

            <!-- BẢNG SẢN PHẨM -->
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Mã SP</th>
                            <th>Tên sản phẩm</th>
                            <th>Thương hiệu</th>
                            <th>Loại</th>
                            <th>Giới tính</th>
                            <th>Giá</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>

                    <tbody id="productList">
                        <!-- JavaScript tự hiển thị sản phẩm -->
                    </tbody>
                </table>
            </div>

            <!-- PHÂN TRANG -->
            <div class="pagination">
                <span id="pageInfo">Trang 1</span>

                <div>
                    <button type="button" id="prevBtn" disabled>
                        Trước
                    </button>

                    <button type="button" id="nextBtn">
                        Sau
                    </button>
                </div>
            </div>
        </section>

        <!-- FORM THÊM/SỬA ĐƯỢC JAVASCRIPT TẠO TẠI ĐÂY -->
    </main>
</body>
</html>
```
