{% extends 'admin_base.html' %}
{% block admin_title %}Đặt lại mật khẩu nhân viên{% endblock %}
{% block admin_content %}
<section class="w12-panel" style="max-width:550px;margin:20px auto;">
  <h1>Đặt lại mật khẩu cho nhân viên</h1>
  <p><strong>{{ user.HoVaTen }}</strong> ({{ user.Email }})</p>
  <form method="post" autocomplete="off" style="display:grid;gap:14px;max-width:420px;">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Mật khẩu mới (từ 8 đến 128 ký tự)
      <input type="password" name="password" required minlength="8" maxlength="128" autocomplete="new-password">
    </label>
    <label>Nhập lại mật khẩu mới
      <input type="password" name="confirm_password" required minlength="8" maxlength="128" autocomplete="new-password">
    </label>
    <button type="submit" class="action-primary" onclick="return confirm('Đặt lại mật khẩu cho nhân viên này?');">Xác nhận đặt lại mật khẩu</button>
    <a href="{{ url_for('w12.staff_list') }}">Quay lại danh sách nhân viên</a>
  </form>
</section>
{% endblock %}
