
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý sản phẩm - Shoes Store</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f5f9;
    color: #222;
}

header {
    background: #202b3c;
    color: white;
    padding: 22px 30px;
}

.container {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 18px;
}

.card {
    background: white;
    padding: 22px;
    border-radius: 10px;
    box-shadow: 0 2px 10px #0000000c;
}

.toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin: 20px 0;
}

input, select {
    padding: 10px;
    border: 1px solid #ccd2dc;
    border-radius: 6px;
}

button {
    border: 0;
    padding: 9px 12px;
    border-radius: 5px;
    cursor: pointer;
    color: white;
    margin: 2px;
}

.btn-hide { background: #d97706; }
.btn-show { background: #15803d; }
.btn-delete { background: #dc2626; }
.btn-disabled { background: #9ca3af; cursor: not-allowed; }

.table-wrap { overflow-x: auto; }

table {
    width: 100%;
    min-width: 760px;
    border-collapse: collapse;
}

th, td {
    padding: 13px;
    text-align: left;
    border-bottom: 1px solid #e5e7eb;
}

th { background: #f1f5f9; }

.active { color: #15803d; font-weight: bold; }
.hidden { color: #dc2626; font-weight: bold; }

#message {
    margin: 15px 0;
    font-weight: bold;
}

@media (max-width: 600px) {
    header { padding: 18px; }
    .card { padding: 12px; }
}
</style>
</head>

<body>
<header>
    <h1>SHOES ADMIN</h1>
    <p>Quản lý sản phẩm</p>
</header>

<main class="container">
<section class="card">
    <h2>Danh sách sản phẩm</h2>

    <div class="toolbar">
        <input id="search" placeholder="Tìm tên sản phẩm...">

        <select id="filter">
            <option value="all">Tất cả trạng thái</option>
            <option value="active">Đang bán</option>
            <option value="inactive">Đã ẩn</option>
        </select>
    </div>

    <p id="message" role="status"></p>

    <div class="table-wrap">
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Tên sản phẩm</th>
            <th>Giá (VNĐ)</th>
            <th>Giao dịch tham chiếu</th>
            <th>Trạng thái</th>
            <th>Thao tác</th>
        </tr>
        </thead>
        <tbody id="productList"></tbody>
    </table>
    </div>
</section>
</main>

<script>
const KEY = "shoes_products_demo";

// Dữ liệu minh họa. Giao dịch tham chiếu được mô phỏng.
const initialProducts = [
    {
        id: 1,
        name: "Nike Air Force 1",
        price: 2500000,
        active: true,
        transactionIds: [1001, 1002]
    },
    {
        id: 2,
        name: "Adidas Superstar",
        price: 1800000,
        active: true,
        transactionIds: []
    },
    {
        id: 3,
        name: "Puma Suede",
        price: 1500000,
        active: false,
        transactionIds: [1003]
    }
];

let products;

try {
    const saved = localStorage.getItem(KEY);
    products = saved === null
        ? initialProducts.map(p => ({...p, transactionIds: [...p.transactionIds]}))
        : JSON.parse(saved);

    if (!Array.isArray(products)) throw new Error("Invalid data");
} catch {
    products = initialProducts.map(p => ({...p, transactionIds: [...p.transactionIds]}));
}

const list = document.getElementById("productList");
const message = document.getElementById("message");

function save() {
    localStorage.setItem(KEY, JSON.stringify(products));
}

function notify(text, success = false) {
    message.textContent = text;
    message.style.color = success ? "#15803d" : "#dc2626";
}

// Ẩn mềm: giữ nguyên sản phẩm và lịch sử giao dịch.
function hideProduct(id) {
    const product = products.find(p => p.id === id);
    if (!product) return;

    if (!product.active) {
        notify("Sản phẩm đã được ẩn.");
        return;
    }

    if (!confirm(`Bạn có chắc muốn ẩn "${product.name}" không?`)) {
        return;
    }

    product.active = false;
    save();
    render();
    notify("Đã ẩn sản phẩm. Dữ liệu và giao dịch vẫn được giữ.", true);
}

// Hiện lại sản phẩm.
function showProduct(id) {
    const product = products.find(p => p.id === id);
    if (!product) return;

    if (!confirm(`Bạn muốn hiện lại "${product.name}"?`)) return;

    product.active = true;
    save();
    render();
    notify("Đã hiện lại sản phẩm.", true);
}

// Xóa cứng: xác nhận và kiểm tra tham chiếu trước khi xóa.
function hardDeleteProduct(id) {
    const product = products.find(p => p.id === id);
    if (!product) return;

    // Kiểm tra tham chiếu giao dịch ở bản demo.
    const hasTransactions =
        Array.isArray(product.transactionIds) &&
        product.transactionIds.length > 0;

    if (hasTransactions) {
        notify(
            `Từ chối xóa "${product.name}": sản phẩm có liên quan đến ` +
            `${product.transactionIds.length} giao dịch. Hãy ẩn sản phẩm.`
        );
        return;
    }

    if (!confirm(
        `CẢNH BÁO: Xóa vĩnh viễn "${product.name}"? ` +
        "Thao tác này không thể hoàn tác."
    )) {
        return;
    }

    // Kiểm tra lại trước khi thực hiện xóa.
    const current = products.find(p => p.id === id);
    if (!current || current.transactionIds.length > 0) {
        notify("Không thể xóa: dữ liệu giao dịch đã thay đổi.");
        return;
    }

    products = products.filter(p => p.id !== id);
    save();
    render();
    notify("Đã xóa cứng sản phẩm.", true);
}

function render() {
    const keyword = document.getElementById("search")
        .value.trim().toLowerCase();

    const filter = document.getElementById("filter").value;

    const filtered = products.filter(p => {
        const matchesName = p.name.toLowerCase().includes(keyword);
        const matchesStatus =
            filter === "all" ||
            (filter === "active" && p.active) ||
            (filter === "inactive" && !p.active);

        return matchesName && matchesStatus;
    });

    list.replaceChildren();

    if (filtered.length === 0) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");
        cell.colSpan = 6;
        cell.textContent = "Không tìm thấy sản phẩm.";
        row.appendChild(cell);
        list.appendChild(row);
        return;
    }

    filtered.forEach(p => {
        const row = document.createElement("tr");

        [
            p.id,
            p.name,
            p.price.toLocaleString("vi-VN"),
            p.transactionIds.length
        ].forEach(value => {
            const cell = document.createElement("td");
            cell.textContent = value;
            row.appendChild(cell);
        });

        const status = document.createElement("td");
        status.textContent = p.active ? "Đang bán" : "Đã ẩn";
        status.className = p.active ? "active" : "hidden";
        row.appendChild(status);

        const actions = document.createElement("td");

        const hideBtn = document.createElement("button");
        hideBtn.textContent = "Ẩn";
        hideBtn.className = "btn-hide";
        hideBtn.disabled = !p.active;
        hideBtn.addEventListener("click", () => hideProduct(p.id));

        const showBtn = document.createElement("button");
        showBtn.textContent = "Hiện";
        showBtn.className = "btn-show";
        showBtn.disabled = p.active;
        showBtn.addEventListener("click", () => showProduct(p.id));

        const deleteBtn = document.createElement("button");
        deleteBtn.textContent = "Xóa cứng";
        deleteBtn.className = p.transactionIds.length
            ? "btn-disabled" : "btn-delete";
        deleteBtn.title = p.transactionIds.length
            ? "Sản phẩm có giao dịch, không được xóa cứng"
            : "Xóa vĩnh viễn";
        deleteBtn.addEventListener("click", () => hardDeleteProduct(p.id));

        actions.append(hideBtn, showBtn, deleteBtn);
        row.appendChild(actions);
        list.appendChild(row);
    });
}

document.getElementById("search").addEventListener("input", render);
document.getElementById("filter").addEventListener("change", render);

save();
render();
</script>
</body>
</html>
